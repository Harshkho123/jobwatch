name: JobWatch

on:
  schedule:
    # PUBLIC repo: every 5 minutes (minutes 2,7,12,...,57). Free and unlimited.
    - cron: "2-57/5 * * * *"
    # PRIVATE repo: replace the line above with hourly, or you will use up the free minutes:
    # - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jobwatch
  cancel-in-progress: false

jobs:
  run-jobwatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job watcher
        run: python job_watch.py
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}

      - name: Save notification history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          if ! git diff --cached --quiet; then
            git commit -m "Update job notification history"
            git push
          fi
